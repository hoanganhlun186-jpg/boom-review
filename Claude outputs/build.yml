name: Build BoomReview Installer

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka zstandard ordered-set
          pip install -r requirements.txt
          pip install requests certifi urllib3 charset-normalizer

      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --jobs=2 `
            --windows-console-mode=disable `
            --windows-product-name="BOOM Review" `
            --windows-product-version=${{ steps.version.outputs.VERSION }}.0 `
            --windows-file-version=${{ steps.version.outputs.VERSION }}.0 `
            --windows-file-description="AI Video Recap Generator" `
            --windows-company-name="Anh Studio" `
            --windows-icon-from-ico=assets\boom_icon.ico `
            --output-dir=dist `
            --output-filename=BoomReview.exe `
            --include-package=engine `
            --include-package=core `
            --include-package=ui `
            --include-package=utils `
            --include-package=capcut_tts_api `
            --include-package=curl_cffi `
            --include-package=PySide6 `
            --include-package=google `
            --include-package=requests `
            --include-package-data=customtkinter `
            --include-package-data=edge_tts `
            --include-package-data=certifi `
            --nofollow-import-to=librosa `
            --nofollow-import-to=scipy `
            --nofollow-import-to=numba `
            --nofollow-import-to=torch `
            --nofollow-import-to=matplotlib `
            --nofollow-import-to=pytest `
            --nofollow-import-to=unittest `
            --nofollow-import-to=pyautogui `
            --enable-plugin=pyside6 `
            --enable-plugin=tk-inter `
            --assume-yes-for-downloads `
            main.py

      - name: Copy assets & CA bundle
        shell: python
        run: |
          import shutil, certifi
          from pathlib import Path
          dist = Path("dist/main.dist")
          shutil.copytree("assets", dist / "assets", dirs_exist_ok=True)
          shutil.copy2(certifi.where(), dist / "cacert.pem")
          (dist / "capcut_device.json").unlink(missing_ok=True)
          shutil.copy2("version.txt", dist / "version.txt")
          print("Assets copied OK")

      - name: Sanitize config for release
        run: python build_sanitize_config.py "dist\main.dist\config.json"

      - name: Download large assets (models + data/tools)
        shell: pwsh
        run: |
          $url = "${{ secrets.ASSETS_DOWNLOAD_URL }}"
          if (-not $url) {
            Write-Host "ASSETS_DOWNLOAD_URL not set — skipping large assets download"
            exit 0
          }
          Write-Host "Downloading boom_assets.zip..."
          Invoke-WebRequest -Uri $url -OutFile "boom_assets.zip" -UseBasicParsing
          Write-Host "Extracting..."
          Expand-Archive -Path "boom_assets.zip" -DestinationPath "dist\main.dist" -Force
          Remove-Item "boom_assets.zip"
          Write-Host "Assets extracted OK"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir installer_output
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if errorlevel 1 exit /b 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "BOOM Review ${{ github.ref_name }}"
          body: |
            ## BOOM Review ${{ github.ref_name }}

            ### Cài đặt
            1. Tải file `BoomReview-Setup-*.exe` bên dưới
            2. Double-click chạy → Next → Next → Finish
            3. App tự tạo shortcut Desktop, chạy luôn!

            > **Lưu ý:** Cần có FFmpeg — đặt `ffmpeg.exe`, `ffprobe.exe` vào thư mục cài đặt.
          files: installer_output/BoomReview-Setup-v${{ steps.version.outputs.VERSION }}-win64.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
