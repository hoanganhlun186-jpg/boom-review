name: Build and Release BoomReview

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install `
          PySide6 `
          requests `
          nuitka `
          ordered-set `
          zstandard `
          pillow `
          curl_cffi `
          edge_tts `
          certifi `
          google-generativeai `
          google-genai `
          opencv-python `
          numpy `
          pydub `
          scipy `
          librosa `
          ffmpeg-python `
          pyperclip `
          "pyautogui==0.9.54" `
          selenium `
          playwright

    - name: Download ffmpeg binaries
      run: |
        # Mirror ổn định hơn gyan.dev
        $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
        Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip
        Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted -Force
        $ffmpegDir = Get-ChildItem ffmpeg_extracted -Directory | Select-Object -First 1
        Copy-Item "$($ffmpegDir.FullName)\bin\ffmpeg.exe" -Destination ffmpeg.exe
        Copy-Item "$($ffmpegDir.FullName)\bin\ffprobe.exe" -Destination ffprobe.exe
        Copy-Item "$($ffmpegDir.FullName)\bin\ffplay.exe" -Destination ffplay.exe
        Write-Host "ffmpeg downloaded OK"

    - name: Build EXE with Nuitka
      env:
        APP_VERSION: ${{ github.ref_name }}
      run: |
        $version = $env:APP_VERSION.TrimStart('v')
        python -m nuitka `
          --standalone `
          --nofollow-import-to=google.genai `
          --nofollow-import-to=google.generativeai `
          --nofollow-import-to=google.ai `
          --windows-console-mode=disable `
          --windows-product-name="BOOM Review" `
          --windows-product-version="$version.0" `
          --windows-file-version="$version.0" `
          --windows-icon-from-ico=assets\boom_icon.ico `
          --output-dir=dist `
          --output-filename=BoomReview.exe `
          --include-package=engine `
          --include-package=core `
          --include-package=ui `
          --include-package=utils `
          --include-package=capcut_tts_api `
          --include-package=requests `
          --include-package=selenium `
          --include-package=PIL `
          --include-package=cv2 `
          --include-module=asset_downloader `
          --include-module=boom_auth `
          --include-module=winreg `
          --include-package-data=edge_tts `
          --include-package-data=certifi `
          --include-package-data=google `
          --include-package-data=librosa `
          --include-package-data=curl_cffi `
          --include-package-data=PIL `
          --include-package-data=scipy `
          --include-package=PySide6.QtMultimedia `
          --include-package=PySide6.QtMultimediaWidgets `
          --enable-plugin=pyside6 `
          --enable-plugin=numpy `
          --enable-plugin=tk-inter `
          --assume-yes-for-downloads `
          --jobs=1 `
          main.py

    - name: Copy assets and ffmpeg
      run: |
        python -c "
        import shutil, certifi
        from pathlib import Path

        dist = Path('dist/main.dist')

        # assets (icon, font, ...)
        shutil.copytree('assets', dist / 'assets', dirs_exist_ok=True)

        # Qt multimedia plugins (cần cho preview video)
        import PySide6
        qt_root = Path(PySide6.__file__).parent
        for plugin_name in ['multimedia', 'mediaservice', 'playlistformats']:
            src_plugin = qt_root / 'plugins' / plugin_name
            if src_plugin.exists():
                shutil.copytree(src_plugin, dist / 'PySide6' / 'plugins' / plugin_name, dirs_exist_ok=True)
                print(f'Copied Qt plugin: {plugin_name}')

        # certifi CA bundle
        shutil.copy2(certifi.where(), dist / 'cacert.pem')

        # version
        shutil.copy2('version.txt', dist / 'version.txt')

        # ffmpeg binaries
        for fname in ['ffmpeg.exe', 'ffprobe.exe', 'ffplay.exe']:
            src = Path(fname)
            if src.exists():
                shutil.copy2(src, dist / fname)
                print(f'Copied {fname}')
            else:
                print(f'ERROR: {fname} not found!')
                raise FileNotFoundError(fname)

        print('Done copying assets')
        "

    - name: Package into ZIP (portable / auto-update)
      shell: pwsh
      run: |
        $pkg = "BoomReview"
        $dist = "dist\main.dist"
        if (-not (Test-Path $dist)) {
            Write-Error "KHONG THAY $dist - build Nuitka that bai"; exit 1
        }
        if (Test-Path $pkg) { Remove-Item $pkg -Recurse -Force }
        Copy-Item -LiteralPath $dist -Destination $pkg -Recurse

        if (-not (Test-Path "$pkg\BoomReview.exe")) {
            Write-Error "THIEU BoomReview.exe trong goi"; exit 1
        }

        "Giai nen thu muc nay ra 1 cho co dinh roi chay BoomReview.exe." | Out-File -FilePath "$pkg\HUONG_DAN.txt" -Encoding utf8

        Compress-Archive -Path $pkg -DestinationPath "BoomReview.zip" -Force
        Write-Host "Da tao BoomReview.zip"

    - name: Install Inno Setup
      run: choco install innosetup --yes

    - name: Build Installer
      env:
        APP_VERSION: ${{ github.ref_name }}
      run: |
        $version = $env:APP_VERSION.TrimStart('v')
        $env:APP_VERSION = $version
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          installer_output/BoomReview-Setup-*.exe
          BoomReview.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify AnhStudio Server
      env:
        ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD }}
        VERSION: ${{ github.ref_name }}
      run: |
        $version = $env:VERSION.TrimStart('v')
        $Url = "http://163.61.182.119:8000/api/admin/publish_update_boomreview"
        $DownloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BoomReview.zip"
        $Body = @{
            latest_version = $version
            download_url = $DownloadUrl
            changelog = "Ban cap nhat BoomReview: v${version}"
            force_update = $true
        } | ConvertTo-Json
        Invoke-RestMethod -Uri $Url -Method Post -Body $Body -ContentType "application/json" -Headers @{ "Authorization" = "Bearer $env:ADMIN_PASS" }
